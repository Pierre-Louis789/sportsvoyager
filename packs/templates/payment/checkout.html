{% extends "base.html" %}

{% block content %}
<div class="card-premium p-4 mx-auto" style="max-width: 600px;">
    <h1 class="fw-bold text-gold mb-3">Checkout</h1>

    <p class="fs-5">You are purchasing:</p>
    <h2 class="fw-bold">{{ pack.title }}</h2>
    <p class="text-muted">{{ pack.club }} — {{ pack.league }}</p>
    <p class="fs-4 text-gold fw-bold">£{{ pack.price }}</p>

    <hr class="my-4">

    <!-- STRIPE BUTTON -->
    <script src="https://js.stripe.com/v3/"></script>

    <button id="checkout-button" class="btn-hero-primary w-100">
        Pay £{{ pack.price }} with Stripe
    </button>

    <script>
        const stripe = Stripe("{{ STRIPE_PUBLIC_KEY }}");

        document.getElementById("checkout-button").addEventListener("click", function () {
            fetch("{% url 'create_checkout_session' pack.pk %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                },
            })
            .then(response => response.json())
            .then(session => {
                stripe.redirectToCheckout({ sessionId: session.id });
            });
        });
    </script>
</div>
{% endblock %}
