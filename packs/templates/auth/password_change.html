{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Change Password</h1>

    <div class="card shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary mt-3">Update Password</button>
            <a href="{% url 'profile' %}" class="btn btn-secondary mt-3 ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
