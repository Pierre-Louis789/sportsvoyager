{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card fade-up">
        <h2 class="auth-title">Create Your Account</h2>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label>Password</label>
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                {{ form.password2 }}
            </div>

            <button class="btn-hero-primary w-100 mt-3">Register</button>

            <div class="mt-3 text-center">
                <a href="{% url 'login' %}" class="text-gold">Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
