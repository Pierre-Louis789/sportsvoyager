{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Reset Your Password</h1>

    <div class="card shadow-sm p-4">
        <p class="text-muted">Enter your email and we’ll send you a reset link.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary mt-3">Send Reset Email</button>
            <a href="{% url 'login' %}" class="btn btn-secondary mt-3 ms-2">Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
