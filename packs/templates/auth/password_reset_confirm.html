{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-4">Choose a New Password</h1>

    <div class="card shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary mt-3">Set New Password</button>
        </form>
    </div>
</div>
{% endblock %}
