{% extends "base.html" %}

{% block content %}
<div class="premium-card p-4 mt-4">
    <h2 class="section-title mb-3">Delete Comment</h2>
    <p>Are you sure you want to delete this comment?</p>

    <div class="premium-card p-3 mb-3">
        <p>{{ comment.text }}</p>
        <small class="text-gold">
            Posted by {{ comment.user.username }} on {{ comment.created_at|date:"M d, Y H:i" }}
        </small>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'pack_detail' comment.pack.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
