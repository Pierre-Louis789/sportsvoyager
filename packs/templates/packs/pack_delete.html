{% extends "base.html" %}

{% block content %}
<div class="card-premium p-4 mx-auto text-center" style="max-width: 600px;">
    <h1 class="fw-bold text-gold mb-3">Delete Pack</h1>

    <p class="mb-4">Are you sure you want to delete <strong>{{ pack.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn-nav-gold w-100 mb-2">Yes, Delete</button>
    </form>

    <a href="{% url 'pack_detail' pack.pk %}" class="btn-nav-outline w-100">Cancel</a>
</div>
{% endblock %}
