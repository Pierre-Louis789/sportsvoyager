{% extends "base.html" %}

{% block content %}
<div class="premium-card p-4 mt-4">
    <h2 class="section-title mb-3">Edit Comment</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-warning mt-2">Save Changes</button>
        <a href="{% url 'pack_detail' comment.pack.pk %}" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
