{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="profile-wrapper fade-up">
    <div class="profile-card">

        <div class="text-center mb-4">
            {% if user.userprofile.avatar %}
                <img src="{{ user.userprofile.avatar.url }}" class="profile-avatar">
            {% endif %}
            <h1 class="text-gold">{{ user.username }}</h1>
            <p class="text-gold">{{ user.email }}</p>
        </div>

        <div class="profile-info">
            <p><strong>Favourite Team:</strong> {{ profile.favourite_team }}</p>
            <p><strong>Country:</strong> {{ profile.country }}</p>
        </div>

        <div class="mt-4">
            <a href="{% url 'profile_edit' %}" class="btn-hero-primary w-100 mb-2">Edit Profile</a>
            <a href="{% url 'password_change' %}" class="btn-hero-ghost w-100">Change Password</a>
        </div>

    </div>
</div>
{% endblock %}
