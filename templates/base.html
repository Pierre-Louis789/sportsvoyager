<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sports Voyager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.locked-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(5px);
    background: rgba(255,255,255,0.6);
    border-radius: 8px;
}
</style>

</head>

<body>
    {% load tz %}


    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/">Sports Voyager</a>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
<!-- FOOTER -->
<footer class="bg-dark text-white mt-5 py-4">
    <div class="container text-center">

        <h5 class="fw-bold">Sports Voyager</h5>
        <p class="mb-2">
            Plan your football weekend in minutes with the best itineraries, stadium guides, and booking links.
        </p>

        <p class="small text-muted mb-0">
            © {{ now|date:"Y" }} Sports Voyager. All rights reserved.
        </p>
    </div>
</footer>

</body>
</html>
