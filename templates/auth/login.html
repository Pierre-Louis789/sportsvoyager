{% extends "base.html" %}

{% block content %}
<h2 class="fw-bold mb-4">Login</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark w-100 mt-3">Login</button>
    <div class="mt-3">
    <a href="{% url 'password_reset' %}" class="text-danger">Forgot your password?</a>
    </div>

</form>
{% endblock %}
