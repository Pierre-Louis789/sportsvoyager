{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4">Create Your Account</h2>

    <div class="card shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                {{ form.password2 }}
            </div>

            <button class="btn btn-primary mt-3">Register</button>
            <a href="{% url 'login' %}" class="btn btn-secondary mt-3 ms-2">Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
