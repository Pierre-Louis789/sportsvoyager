{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4">Your Profile</h2>

    <div class="card shadow-sm p-4">
        <div class="text-center">
            {% if user.userprofile.avatar %}
                <img src="{{ user.userprofile.avatar.url }}" class="rounded-circle mb-3" width="120">
            {% endif %}
            <h4>{{ user.username }}</h4>
            <p class="text-muted">{{ user.email }}</p>
        </div>

        <hr>

        <p><strong>Favourite Team:</strong> {{ profile.favourite_team }}</p>
        <p><strong>Country:</strong> {{ profile.country }}</p>

        <a href="{% url 'profile_edit' %}" class="btn btn-primary mt-3">Edit Profile</a>
        <a href="{% url 'password_change' %}" class="btn btn-warning mt-3">Change Password</a>
        

    </div>
</div>
{% endblock %}
