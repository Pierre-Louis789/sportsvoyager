{% extends "base.html" %}

{% block content %}
<div class="card-premium p-4 mx-auto" style="max-width: 600px;">
    <h2 class="fw-bold text-gold mb-3">Checkout</h2>

    <p class="fs-5">You are purchasing:</p>
    <h3 class="fw-bold">{{ pack.title }}</h3>
    <p class="text-muted">{{ pack.club }} — {{ pack.league }}</p>
    <p class="fs-4 text-gold fw-bold">£{{ pack.price }}</p>

    <hr class="my-4">

    <form method="POST" action="{% url 'payment_success' pack.pk %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="4242 4242 4242 4242" required>
        </div>

        <div class="row">
            <div class="col">
                <label class="form-label">Expiry</label>
                <input type="text" class="form-control" placeholder="12/28" required>
            </div>
            <div class="col">
                <label class="form-label">CVC</label>
                <input type="text" class="form-control" placeholder="123" required>
            </div>
        </div>

        <button class="btn-hero-primary w-100 mt-4">Pay Now</button>
    </form>
</div>
{% endblock %}
